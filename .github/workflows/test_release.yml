name: 测试发布

permissions:
  contents: write  # 允许写入仓库内容（用于推送标签）
  actions: write   # 允许触发其他 Actions

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否创建发布版本?'
        required: true
        type: boolean  # 修正：原"输入"改为标准type
        default: true
      kernelsu_variant:
        description: "选择 KernelSU 变体"
        required: true
        type: choice  # 修正：原"输入"改为标准type
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU  # 修正：原"默认"改为标准default
      kernelsu_branch:
        description: "选择 KSU 分支"
        required: true
        type: choice  # 修正：原"输入"改为标准type
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)  # 修正：原"默认"改为标准default
      version:
        description: '自定义版本名(如5.10.198后面的字符/留空则使用默认版本号)'
        required: false
        type: string  # 修正：补充标准type字段
      use_zram:
        description: '是否开启增加更多ZRAM算法?'
        required: true
        type: boolean  # 修正：原"输入"改为标准type
        default: true
      use_bbg:
        description: '是否开启BBG防格机补丁?'
        required: true
        type: boolean  # 修正：原"输入"改为标准type
        default: true
      use_kpm:
        description: '是否开启KPM功能?'
        required: true
        type: boolean  # 修正：原"输入"改为标准type
        default: true
      get_manager:
        description: '是否同时获取最新KSU管理器?'
        required: true
        type: boolean  # 修正：原"输入"改为标准type
        default: false

jobs:
  # 获取 KSU 管理器
  get_manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

  # 构建各版本内核
  build-kernel-a12-5-10:
    uses: ./.github/workflows/kernel-a12-5.10.yml
    secrets: inherit
    with:
      make_release: true  # 此处固定为true，如需动态可改为 ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_bbg: ${{ inputs.use_bbg }}

  build-kernel-a13-5-15:
    uses: ./.github/workflows/kernel-a13-5.15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_bbg: ${{ inputs.use_bbg }}

  build-kernel-a14-6-1:
    uses: ./.github/workflows/kernel-a14-6.1.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_bbg: ${{ inputs.use_bbg }}

  build-kernel-a15-6-6:
    uses: ./.github/workflows/kernel-a15-6.6.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_kpm: ${{ inputs.use_kpm }}
      use_bbg: ${{ inputs.use_bbg }}

  # 触发发布流程
  trigger-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:  # 依赖所有构建任务完成
      - get_manager
      - build-kernel-a12-5-10
      - build-kernel-a13-5-15
      - build-kernel-a14-6-1
      - build-kernel-a15-6-6
    if: ${{ inputs.make_release }}  # 仅当选择创建发布时执行
    env:
      REPO_OWNER: AoGou3175
      REPO_NAME: GKI_KernelSU_SUSFS
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 发布名称（优化拼接逻辑）
      RELEASE_NAME: >-
        GKI内核: ${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}
        (${{ needs.get_manager.outputs.ksuVer }}) & SUSFS ${{ needs.get_manager.outputs.susVer }}
      # 初始发布说明
      RELEASE_NOTES: |
        此处包含：**${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}**、SUSFS ${{ needs.get_manager.outputs.susVer }} ${{ inputs.use_zram && '、LZ4KD' || '' }}

        功能:
        -> ${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}${{ inputs.kernelsu_variant == 'Official' && '原版' || '' }}${{ inputs.kernelsu_branch == 'Dev(开发)' && format('({0})', needs.get_manager.outputs.ksuVer) || '稳定版' }}
        -> SUSFS ඞ ${{ needs.get_manager.outputs.susVer }}
        -> SUSFS Inline Hooks
        ${{ inputs.kernelsu_variant != 'Official' && '-> Magic Mount 支持' || '-> OVERLAYFS 支持' }}
        -> BBG安全补丁 ${{ inputs.use_bbg && '支持' || '不支持' }}
        ${{ inputs.use_kpm && '-> KPM 支持' || '' }}
        -> **LZ4KD&ONEPLUS_LZ4K**  ${{ inputs.use_zram && '开启' || '未开启' }}
        -> lz4: v1.10.0 ${{ inputs.use_zram && '开启' || '未开启' }}
        
        模块: 
        -> https://github.com/sidex15/ksu_module_susfs

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4  # 升级到最新版本

      # 确定 KernelSU 分支
      - name: 确定 KernelSU 分支
        run: |
          # 根据变体确定默认分支
          if [[ "${{ inputs.kernelsu_variant }}" =~ ^(Official|MKSU|SukiSU)$ ]]; then
            BRANCH="main"
          elif [[ "${{ inputs.kernelsu_variant }}" == "Next" ]]; then
            BRANCH="next"
          else
            echo "错误：不支持的变体类型" >&2
            exit 1
          fi
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "已确定KSU分支：$BRANCH"

      # 获取 KernelSU 提交/标签信息
      - name: 获取 KernelSU 版本引用和URL
        run: |
          # 定义各变体的仓库地址
          case "${{ inputs.kernelsu_variant }}" in
            Official)
              REPO_URL="https://github.com/tiann/KernelSU.git"
              REPO_URL2="tiann/KernelSU"
              ;;
            Next)
              REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
              REPO_URL2="KernelSU-Next/KernelSU-Next"
              ;;
            MKSU)
              REPO_URL="https://github.com/5ec1cff/KernelSU.git"
              REPO_URL2="5ec1cff/KernelSU"
              ;;
            SukiSU)
              REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
              REPO_URL2="SukiSU-Ultra/SukiSU-Ultra"
              ;;
            *)
              echo "错误：未知的KernelSU变体" >&2
              exit 1
              ;;
          esac

          # 根据分支类型获取引用
          if [[ "${{ inputs.kernelsu_branch }}" == "Stable(标准)" && "${{ inputs.kernelsu_variant }}" != "MKSU" ]]; then
            # 获取最新标签
            TAG=$(git ls-remote --tags --sort=-v:refname $REPO_URL | grep -o 'refs/tags/.*' | cut -d'/' -f3 | head -n1)
            if [[ -z "$TAG" ]]; then
              echo "错误：无法获取Stable分支的最新标签" >&2
              exit 1
            fi
            KSU_REF=$TAG
            KSU_URL="https://github.com/$REPO_URL2/releases/tag/$TAG"
          else
            # 获取开发分支最新提交
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/$KSU_BRANCH | awk '{ print $1 }')
            if [[ -z "$COMMIT_HASH" ]]; then
              echo "错误：无法获取Dev分支的最新提交" >&2
              exit 1
            fi
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          # 保存到环境变量
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV
          echo "KernelSU引用：$KSU_REF"
          echo "KernelSU地址：$KSU_URL"

      # 获取 SUSFS 各分支提交信息
      - name: 获取 SUSFS 提交信息
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"

          # 定义分支映射
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
          )

          # 遍历获取每个分支的提交信息
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            # 获取提交哈希
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "$branch_name 提交哈希：$COMMIT_HASH"
              echo "$branch_name 提交地址：$COMMIT_URL"
              # 保存到环境变量
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            else
              echo "警告：未获取到$branch_name分支的提交信息"
              echo "COMMIT_HASH_${var_name}=未知" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=#" >> "$GITHUB_ENV"
            fi
          done

      # 补充管理器下载地址到发布说明
      - name: 补充管理器地址到发布说明
        run: |
          # 定义各变体的管理器地址
          case "${{ inputs.kernelsu_variant }}" in
            Official)
              MANAGER_INFO="Official 管理器:\n-> https://github.com/tiann/KernelSU"
              ;;
            Next)
              MANAGER_INFO="Next 管理器:\n-> https://github.com/KernelSU-Next/KernelSU-Next"
              ;;
            MKSU)
              MANAGER_INFO="MKSU 管理器:\n-> https://github.com/5ec1cff/KernelSU"
              ;;
            SukiSU)
              MANAGER_INFO="SukiSU 管理器:\n-> https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            *)
              MANAGER_INFO="未知管理器版本"
              ;;
          esac

          # 拼接发布说明
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "${{ env.RELEASE_NOTES }}\n${MANAGER_INFO}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 补充提交信息到发布说明
      - name: 补充提交信息到发布说明
        run: |
          # 拼接详细提交信息
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo -e "${{ env.RELEASE_NOTES }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "<details>" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "<summary>提交信息</summary>" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "提交的哈希值与链接(以下提交指的是,本次编译时,KSU或SUSFS所在的进度):" >> $GITHUB_ENV
          echo "- **KernelSU为${{ inputs.kernelsu_variant == 'Next' && 'KernelSU-' || '' }}${{ inputs.kernelsu_variant }}${{ inputs.kernelsu_branch == 'Dev(开发)' && format('({0})', needs.get_manager.outputs.ksuVer) || '稳定版' }}** (提交): [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- **SUSFS4KSU** (提交):" >> $GITHUB_ENV
          echo "  - gki-android12-5.10: [${{ env.COMMIT_HASH_gki_android12_5_10 }}](${{ env.COMMIT_URL_gki_android12_5_10 }})" >> $GITHUB_ENV
          echo "  - gki-android13-5.15: [${{ env.COMMIT_HASH_gki_android13_5_15 }}](${{ env.COMMIT_URL_gki_android13_5_15 }})" >> $GITHUB_ENV
          echo "  - gki-android14-6.1: [${{ env.COMMIT_HASH_gki_android14_6_1 }}](${{ env.COMMIT_URL_gki_android14_6_1 }})" >> $GITHUB_ENV
          echo "  - gki-android15-6.6: [${{ env.COMMIT_HASH_gki_android15_6_6 }}](${{ env.COMMIT_URL_gki_android15_6_6 }})" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "</details>" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "点击下方 **【Assets】** 展开资源,底部还包含最新 **KSU管理器、CI构建SUSFS模块** " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 生成并创建新标签
      - name: 生成和创建新标签
        run: |
          # 获取SUS版本和最新标签
          SUS_VERSION=${{ needs.get_manager.outputs.susVer }}
          # 处理标签为空的情况
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null | sed 's/-.*//')
          
          # 处理首次发布无标签的情况
          if [[ -z "$LATEST_TAG" ]]; then
            echo "首次发布，初始化标签"
            NEW_TAG="${SUS_VERSION}-r1"
          else
            # 对比版本号
            if [ "$SUS_VERSION" = "$LATEST_TAG" ]; then
              echo "版本相同，递增修订号"
              # 获取当前完整标签
              FULL_LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null)
              # 递增修订号
              NEW_TAG=$(echo "$FULL_LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
            else
              echo "版本不同，创建新标签"
              NEW_TAG="${SUS_VERSION}-r1"
            fi
          fi

          # 输出并保存新标签
          echo "新标签：$NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          
          # 推送标签（需先配置git用户信息）
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG

      # 下载构建产物
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts
          merge-multiple: true  # 合并多个产物到同一目录

      # 创建GitHub Release
      - name: 创建GitHub Release
        uses: softprops/action-gh-release@v2  # 替代废弃的create-release
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true
          files: |
            ./downloaded-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 验证上传文件
      - name: 显示已上传文件
        run: |
          echo "已上传的文件列表："
          ls -l ./downloaded-artifacts/ || echo "无产物文件"
