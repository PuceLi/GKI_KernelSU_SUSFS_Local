name: Test Telegram Notification

on:
  workflow_dispatch:  # Cho phép anh chạy thủ công từ GitHub UI

env:
  RELEASE_NAME: "Test Kernel" 
  RELEASE_NOTE: "Đây là bản test gửi thông báo Telegram nhe~"
  NEW_TAG: "vTestTag"

jobs:
  send-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Gửi thông báo Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d parse_mode=Markdown \
            -d text="🎉 *Build hoàn tất!*%0A🧪 Đây là bản test xuống dòng nè~%0A✅ Dòng 3 nè%0A❤"

