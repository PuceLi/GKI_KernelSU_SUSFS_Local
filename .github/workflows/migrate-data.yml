name: 紧急修复 - 格式化 JSON 并移回 Config 目录

permissions:
  contents: write

on:
  workflow_dispatch: # 手动触发

jobs:
  fix-and-move:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复漂亮的 JSON 排版并转移目录
        run: |
          # 遍历目前 data 目录下的所有 JSON 文件
          for FILE in $(find data -type f -name "*.json"); do
            # 获取相对路径，例如 android13/5.15.json
            REL_PATH=${FILE#data/}
            
            # 设置正确的 config 目标路径
            TARGET_FILE="config/${REL_PATH}"
            mkdir -p "$(dirname "$TARGET_FILE")"
            
            echo "正在修复: $FILE -> $TARGET_FILE"
            
            # 【关键修复】：只用 jq '.'，不加 -c 参数，它会自动把单行 JSON 展开成漂亮的多行带缩进格式！
            jq '.' "$FILE" > "$TARGET_FILE"
          done
          
          echo "✅ 所有文件已恢复排版并移动到 config/ 目录！"
          
          # 展示一下修复后的前 15 行看看效果
          head -n 15 config/android14/6.1.json || true

      - name: 提交并清理错误目录
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加新的 config 目录
          git add config/
          
          # 删掉整个搞错的 data 目录
          git rm -r data/ || true
          
          git commit -m "fix: 将 KMI 数据库移回 config 目录并恢复 JSON 漂亮排版"
          
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
          echo "🎉 修复完成！强迫症得救了！"
