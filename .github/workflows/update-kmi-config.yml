name: 自动更新 KMI 版本配置

permissions:
  contents: write # 允许工作流向仓库提交代码

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 0 * * 0' # 每周日午夜自动运行

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 从 AOSP 提取最新 KMI Tag 和 Sublevel (子版本号)
        run: |
          mkdir -p config
          CONFIG_FILE="config/kmi_latest.env"
          JSON_FILE="config/kmi_versions.json"
          
          echo "# 自动生成的 KMI 版本配置" > $CONFIG_FILE
          echo "{" > $JSON_FILE
          
          BRANCHES=("android12-5.10" "android13-5.15" "android14-5.15" "android14-6.1" "android15-6.6")
          TOTAL=${#BRANCHES[@]}
          COUNT=0
          
          echo "正在连接 Google 服务器，查询 kernel/common 仓库的 Tags..."
          ALL_TAGS=$(git ls-remote --tags https://android.googlesource.com/kernel/common | grep -o 'refs/tags/android.*' | sed 's/refs\/tags\///' | grep -v '\^{}')
          
          for BRANCH in "${BRANCHES[@]}"; do
            echo "------------------------------------------------"
            echo "🔍 正在分析分支: $BRANCH"
            
            # 获取最新的一条 Tag
            LATEST_TAG=$(echo "$ALL_TAGS" | grep "^${BRANCH}-" | sort -V | tail -n 1)
            
            if [ -n "$LATEST_TAG" ]; then
                echo "✅ 找到最新 Tag: ${LATEST_TAG}"
                
                # 【神级操作】直接通过 Google Gitiles API 以 Base64 格式读取该 Tag 下的 Makefile，提取 SUBLEVEL
                echo "📄 正在抓取该版本的 Makefile 解析小版本号..."
                SUBLEVEL=$(curl -s "https://android.googlesource.com/kernel/common/+/refs/tags/${LATEST_TAG}/Makefile?format=TEXT" | base64 --decode | grep -E '^SUBLEVEL\s*=' | awk -F'=' '{print $2}' | tr -d ' ' | tr -d '\r')
                
                if [ -n "$SUBLEVEL" ]; then
                    echo "🎯 成功解析到 Sublevel: $SUBLEVEL"
                else
                    SUBLEVEL="unknown"
                    echo "⚠️ 未能解析到 Sublevel"
                fi
                
                # 写入 ENV 文件配置
                VAR_PREFIX=$(echo "${BRANCH}" | tr 'a-z' 'A-Z' | tr '-' '_' | tr '.' '_')
                echo "${VAR_PREFIX}_LATEST=${LATEST_TAG}" >> $CONFIG_FILE
                echo "${VAR_PREFIX}_SUBLEVEL=${SUBLEVEL}" >> $CONFIG_FILE
                
                # 写入 JSON 配置
                COUNT=$((COUNT+1))
                if [ $COUNT -lt $TOTAL ]; then
                  echo "  \"${BRANCH}\": {" >> $JSON_FILE
                  echo "    \"tag\": \"${LATEST_TAG}\"," >> $JSON_FILE
                  echo "    \"sublevel\": \"${SUBLEVEL}\"" >> $JSON_FILE
                  echo "  }," >> $JSON_FILE
                else
                  echo "  \"${BRANCH}\": {" >> $JSON_FILE
                  echo "    \"tag\": \"${LATEST_TAG}\"," >> $JSON_FILE
                  echo "    \"sublevel\": \"${SUBLEVEL}\"" >> $JSON_FILE
                  echo "  }" >> $JSON_FILE
                fi
            else
                echo "⚠️ 未找到 $BRANCH 的 Tag"
                COUNT=$((COUNT+1))
                if [ $COUNT -lt $TOTAL ]; then
                  echo "  \"${BRANCH}\": {" >> $JSON_FILE
                  echo "    \"tag\": \"\"," >> $JSON_FILE
                  echo "    \"sublevel\": \"\"" >> $JSON_FILE
                  echo "  }," >> $JSON_FILE
                else
                  echo "  \"${BRANCH}\": {" >> $JSON_FILE
                  echo "    \"tag\": \"\"," >> $JSON_FILE
                  echo "    \"sublevel\": \"\"" >> $JSON_FILE
                  echo "  }" >> $JSON_FILE
                fi
            fi
          done
          
          echo "}" >> $JSON_FILE
          echo "------------------------------------------------"
          echo "抓取完成！kmi_latest.env 预览："
          cat $CONFIG_FILE

      - name: 提交并推送生成的配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain config/)" ]; then
            git add config/kmi_latest.env config/kmi_versions.json
            git commit -m "chore: 自动更新 KMI 版本配置 (含 Sublevel)"
            git push
            echo "🎉 最新 KMI 配置文件 (含小版本号) 已推送到代码库！"
          else
            echo "KMI 版本没有变化，无需提交。"
          fi
