name: 自动更新全量 KMI 历史版本库

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  fetch-all-versions:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 抓取全量历史 KMI 版本与 Sublevel (防限流版)
        run: |
          mkdir -p config
          ENV_FILE="config/kmi_latest.env"
          JSON_FILE="config/kmi_versions.json"
          
          echo "# 自动生成的最新 KMI 快捷配置" > $ENV_FILE
          echo "{" > $JSON_FILE
          
          BRANCHES=("android12-5.10" "android13-5.15" "android14-5.15" "android14-6.1" "android15-6.6" "android16-6.12")
          TOTAL_BRANCHES=${#BRANCHES[@]}
          BRANCH_COUNT=0
          
          echo "正在连接 Google 服务器，查询全量 Tags..."
          ALL_TAGS=$(git ls-remote --tags https://android.googlesource.com/kernel/common | grep -o 'refs/tags/android.*' | sed 's/refs\/tags\///' | grep -v '\^{}')
          
          for BRANCH in "${BRANCHES[@]}"; do
            echo "================================================"
            echo "🔍 正在分析分支全量历史: $BRANCH"
            BRANCH_COUNT=$((BRANCH_COUNT+1))
            
            BRANCH_TAGS=$(echo "$ALL_TAGS" | grep "^${BRANCH}-" | sort -V)
            echo "  \"${BRANCH}\": [" >> $JSON_FILE
            
            if [ -n "$BRANCH_TAGS" ]; then
              TAG_COUNT=$(echo "$BRANCH_TAGS" | wc -l)
              CURRENT_INDEX=0
              
              for TAG in $BRANCH_TAGS; do
                CURRENT_INDEX=$((CURRENT_INDEX+1))
                
                # ================= 核心防封禁抓取逻辑 =================
                MAX_RETRIES=4
                RETRY_COUNT=0
                SUBLEVEL=""
                
                while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                  # 基础延迟，防止请求过快 (0.2秒)
                  sleep 0.2 
                  
                  # 使用 curl -f，如果 Google 返回 429 或 404 等错误码，直接判定为失败
                  API_RESULT=$(curl -s -f "https://android.googlesource.com/kernel/common/+/refs/tags/${TAG}/Makefile?format=TEXT" || echo "FAILED")
                  
                  if [ "$API_RESULT" != "FAILED" ]; then
                    SUBLEVEL=$(echo "$API_RESULT" | base64 --decode | grep -E '^SUBLEVEL\s*=' | awk -F'=' '{print $2}' | tr -d ' ' | tr -d '\r')
                    if [ -n "$SUBLEVEL" ]; then
                      break # 成功拿到版本号，跳出重试循环
                    fi
                  fi
                  
                  # 如果失败，等待一段时间后重试 (依次等待 2s, 4s, 6s)
                  RETRY_COUNT=$((RETRY_COUNT+1))
                  if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                    WAIT_TIME=$((RETRY_COUNT * 2))
                    echo "  -> ⚠️ 抓取限流，等待 $WAIT_TIME 秒后重试 ($RETRY_COUNT/$MAX_RETRIES)..."
                    sleep $WAIT_TIME
                  fi
                done
                
                # 如果试了4次还是失败，就标记为 unknown
                [ -z "$SUBLEVEL" ] && SUBLEVEL="unknown"
                # =======================================================
                
                echo "  -> [$CURRENT_INDEX/$TAG_COUNT] $TAG (小版本: $SUBLEVEL)"
                
                if [ $CURRENT_INDEX -lt $TAG_COUNT ]; then
                  echo "    { \"tag\": \"$TAG\", \"sublevel\": \"$SUBLEVEL\" }," >> $JSON_FILE
                else
                  echo "    { \"tag\": \"$TAG\", \"sublevel\": \"$SUBLEVEL\" }" >> $JSON_FILE
                  
                  VAR_PREFIX=$(echo "${BRANCH}" | tr 'a-z' 'A-Z' | tr '-' '_' | tr '.' '_')
                  echo "${VAR_PREFIX}_LATEST=${TAG}" >> $ENV_FILE
                  echo "${VAR_PREFIX}_SUBLEVEL=${SUBLEVEL}" >> $ENV_FILE
                fi
              done
            else
              echo "⚠️ 未找到 $BRANCH 的任何历史 Tag"
            fi
            
            if [ $BRANCH_COUNT -lt $TOTAL_BRANCHES ]; then
              echo "  ]," >> $JSON_FILE
            else
              echo "  ]" >> $JSON_FILE
            fi
          done
          
          echo "}" >> $JSON_FILE
          echo "================================================"
          echo "全量抓取完成！"

      - name: 提交并推送生成的配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain config/)" ]; then
            git add config/kmi_latest.env config/kmi_versions.json
            git commit -m "chore: 更新 KMI 历史全量版本库 (修复限流问题)"
            git push
            echo "🎉 包含所有历史版本的 KMI 数据库已推送到代码库！"
          else
            echo "KMI 版本库没有变化，无需提交。"
          fi
