name: 自动更新全量 KMI 版本库

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: '强制全量刷新 (忽略现有配置，重新抓取所有版本)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0' # 每周日自动运行（增量模式）

jobs:
  fetch-all-versions:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v6

      - name: 增量抓取 KMI 版本 (终极分层聚合与美化版)
        run: |
          mkdir -p config
          ENV_FILE="config/kmi_latest.env"
          FORCE_REFRESH="${{ github.event.inputs.force_refresh }}"
          
          echo "# 自动生成的最新 KMI 快捷配置" > "$ENV_FILE"
          
          BRANCHES=("android12-5.10" "android13-5.15" "android14-5.15" "android14-6.1" "android15-6.6" "android16-6.12")
          TOTAL_BRANCHES=${#BRANCHES[@]}
          
          echo "正在查询 Google 服务器全量 Tags..."
          ALL_TAGS=$(git ls-remote --tags https://android.googlesource.com/kernel/common | grep -o 'refs/tags/android.*' | sed 's/refs\/tags\///' | grep -v '\^{}')
          
          for i in "${!BRANCHES[@]}"; do
            BRANCH="${BRANCHES[$i]}"
            
            # 【核心逻辑1】：智能提取安卓版本和内核版本作为路径
            A_VER=$(echo "$BRANCH" | awk -F'-' '{print $1}')
            K_VER=$(echo "$BRANCH" | awk -F'-' '{print $2}')
            
            TARGET_DIR="config/${A_VER}"
            mkdir -p "$TARGET_DIR"
            JSON_FILE="${TARGET_DIR}/${K_VER}.json"
            
            # 读取现有的新版分层 JSON 数据库
            if [ -f "$JSON_FILE" ] && [ "$FORCE_REFRESH" != "true" ]; then
              echo "📥 加载现有数据库进行增量更新: $JSON_FILE"
              OLD_JSON=$(cat "$JSON_FILE")
            else
              echo "♻️ 强制全量模式或无旧配置，将重新抓取: $BRANCH"
              OLD_JSON="{}"
            fi

            echo "================================================"
            echo "🔍 正在分析分支: $BRANCH -> 归档至 $JSON_FILE"
            
            # 筛选该分支的 Tags
            BRANCH_TAGS=$(echo "$ALL_TAGS" | grep "^${BRANCH}-" | sort -V)
            
            if [ -n "$BRANCH_TAGS" ]; then
              TAG_ARRAY=($BRANCH_TAGS)
              TAG_COUNT=${#TAG_ARRAY[@]}
              
              # 准备一个临时数组存取所有抓到的 Tag 和 Sublevel
              TEMP_ARRAY="["
              
              for j in "${!TAG_ARRAY[@]}"; do
                TAG="${TAG_ARRAY[$j]}"
                
                # 【核心逻辑2】：从最新的 nested 结构中查找旧记录
                EXISTING_SUB=$(echo "$OLD_JSON" | jq -r 'if .latest then (.latest + .obsolete)[] | .sublevel as $sub | .tags[] | select(. == "'$TAG'") | $sub else empty end' 2>/dev/null | grep -v "unknown" | head -n 1 || echo "")
                
                if [ -n "$EXISTING_SUB" ]; then
                  SUBLEVEL="$EXISTING_SUB"
                  echo "  -> [$((j+1))/$TAG_COUNT] 跳过 (已有记录): $TAG -> $SUBLEVEL"
                else
                  # 只有数据库里没有，或者是 unknown，才发起请求
                  echo "  -> [$((j+1))/$TAG_COUNT] 正在抓取: $TAG..."
                  
                  # 内部抓取重试逻辑
                  RETRY_COUNT=0
                  SUBLEVEL=""
                  while [ $RETRY_COUNT -lt 4 ]; do
                    sleep 0.2 # 呼吸延迟
                    API_RESULT=$(curl -s -f "https://android.googlesource.com/kernel/common/+/refs/tags/${TAG}/Makefile?format=TEXT" || echo "FAILED")
                    
                    if [ "$API_RESULT" != "FAILED" ]; then
                      SUBLEVEL=$(echo "$API_RESULT" | base64 --decode | grep -E '^SUBLEVEL\s*=' | awk -F'=' '{print $2}' | tr -d ' ' | tr -d '\r')
                      [ -n "$SUBLEVEL" ] && break
                    fi
                    
                    RETRY_COUNT=$((RETRY_COUNT+1))
                    WAIT_TIME=$((RETRY_COUNT * 2))
                    echo "     ⚠️ 限流或失败，等待 ${WAIT_TIME}s 重试 ($RETRY_COUNT/4)..."
                    sleep $WAIT_TIME
                  done
                  [ -z "$SUBLEVEL" ] && SUBLEVEL="unknown"
                fi
                
                # 追加到临时字符串
                COMMA=$([ $((j+1)) -lt $TAG_COUNT ] && echo "," || echo "")
                TEMP_ARRAY="${TEMP_ARRAY} { \"tag\": \"$TAG\", \"sublevel\": \"$SUBLEVEL\" }${COMMA}"
                
                # 如果是该分支的最后一个（最新的）Tag，写入 Env 快捷文件
                if [ $((j+1)) -eq $TAG_COUNT ]; then
                  VAR_PREFIX=$(echo "${BRANCH}" | tr 'a-z' 'A-Z' | tr '-' '_' | tr '.' '_')
                  echo "${VAR_PREFIX}_LATEST=${TAG}" >> "$ENV_FILE"
                  echo "${VAR_PREFIX}_SUBLEVEL=${SUBLEVEL}" >> "$ENV_FILE"
                fi
              done
              
              TEMP_ARRAY="${TEMP_ARRAY} ]"
              
              # 【核心逻辑3】：深度聚合 + 保持漂亮排版
              # 过滤 unknown -> 按数字分组 -> 聚合 tags 并倒序 -> 取前4为 latest
              jq -n "
                ($TEMP_ARRAY | map(select(.sublevel != \"unknown\"))) as \$valid_items |
                \$valid_items | group_by(.sublevel | tonumber? // 0) | reverse |
                map({
                  sublevel: .[0].sublevel | tostring,
                  tags: map(.tag) | sort | reverse
                }) |
                {
                  latest: .[:4],
                  obsolete: .[4:]
                }
              " > "$JSON_FILE.new"
              
              mv "$JSON_FILE.new" "$JSON_FILE"
            else
              echo "⚠️ 未找到 $BRANCH 的任何历史 Tag"
            fi
          done
          
          echo "✅ 增量同步与聚合格式化完成！"

      - name: 提交并推送生成的配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查 config 目录是否有变化
          if [ -n "$(git status --porcelain config/)" ]; then
            git add config/
            git commit -m "chore: 增量更新 KMI 数据库 (分层聚合版)"
            
            # 在推送前先拉取远端更新并变基，防止 ! [rejected] 错误
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
            
            echo "🎉 数据库已更新并推送到仓库！"
          else
            echo "KMI 版本库没有变化，无需提交。"
          fi
