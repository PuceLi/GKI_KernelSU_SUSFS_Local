name: 自动更新 KMI 版本配置

permissions:
  contents: write # 允许工作流向仓库提交代码

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 0 * * 0' # 每周日午夜自动运行

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 从 AOSP Common 源码库提取最新 KMI Tag
        run: |
          mkdir -p config
          CONFIG_FILE="config/kmi_latest.env"
          JSON_FILE="config/kmi_versions.json"
          
          echo "# 自动生成的 KMI 版本配置" > $CONFIG_FILE
          echo "{" > $JSON_FILE
          
          # 需要追踪的基础大版本
          BRANCHES=("android12-5.10" "android13-5.15" "android14-5.15" "android14-6.1" "android15-6.6")
          TOTAL=${#BRANCHES[@]}
          COUNT=0
          
          echo "正在连接 Google 服务器，查询 kernel/common 仓库的 Tags..."
          # 获取所有带 android 前缀的 tag，剔除无用的 ^{}，纯文本流处理，速度极快
          ALL_TAGS=$(git ls-remote --tags https://android.googlesource.com/kernel/common | grep -o 'refs/tags/android.*' | sed 's/refs\/tags\///' | grep -v '\^{}')
          
          for BRANCH in "${BRANCHES[@]}"; do
            echo "------------------------------------------------"
            echo "🔍 正在匹配分支: $BRANCH"
            
            # 从海量 Tag 中筛选出当前分支，按版本号自然排序 (sort -V) 获取最新的一条
            LATEST_TAG=$(echo "$ALL_TAGS" | grep "^${BRANCH}-" | sort -V | tail -n 1)
            
            if [ -n "$LATEST_TAG" ]; then
                # 生成环境变量大写名，例如 ANDROID14_6_1_LATEST
                VAR_NAME=$(echo "${BRANCH}_LATEST" | tr 'a-z' 'A-Z' | tr '-' '_' | tr '.' '_')
                echo "${VAR_NAME}=${LATEST_TAG}" >> $CONFIG_FILE
                
                # 写入 JSON
                COUNT=$((COUNT+1))
                if [ $COUNT -lt $TOTAL ]; then
                  echo "  \"${BRANCH}\": \"${LATEST_TAG}\"," >> $JSON_FILE
                else
                  echo "  \"${BRANCH}\": \"${LATEST_TAG}\"" >> $JSON_FILE
                fi
                echo "✅ 成功提取最新 Tag: ${LATEST_TAG}"
            else
                echo "⚠️ 未找到 $BRANCH 的 Tag"
                COUNT=$((COUNT+1))
                [ $COUNT -lt $TOTAL ] && echo "  \"${BRANCH}\": \"\"," >> $JSON_FILE || echo "  \"${BRANCH}\": \"\"" >> $JSON_FILE
            fi
          done
          
          echo "}" >> $JSON_FILE
          echo "------------------------------------------------"
          echo "抓取完成！kmi_latest.env 预览："
          cat $CONFIG_FILE

      - name: 提交并推送生成的配置
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain config/)" ]; then
            git add config/kmi_latest.env config/kmi_versions.json
            git commit -m "chore: 自动更新 KMI 版本配置"
            git push
            echo "🎉 最新 KMI 配置文件已推送到代码库！"
          else
            echo "KMI 版本没有变化，无需提交。"
          fi
