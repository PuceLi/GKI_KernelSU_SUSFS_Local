name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android14
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "6.1"
      os_patch_level:
        description: "安全补丁级别 (填 latest 自动读取最新，或手填如 2026-03)"
        required: true
        type: string
        default: "latest"
      sub_level:
        description: "子版本号 (上方选 latest 时会自动覆盖)"
        required: true
        type: string
        default: "auto"
      revision:
        description: "修订版本 (上方选 latest 时会自动覆盖)"
        required: false
        type: string
        default: ""

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - MKSU
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      kernelsu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (N 为当前 UTC 时间)"
        required: false
        type: string
        default: "N"

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_kpm:
        description: "启用 KPM 功能"
        required: true
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false

jobs:
  # ==================== 解析配置中心 ====================
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      patch: ${{ steps.parse.outputs.patch }}
      rev: ${{ steps.parse.outputs.rev }}
      sub: ${{ steps.parse.outputs.sub }}
      time: ${{ steps.parse.outputs.time }}
    steps:
      - name: 检出代码读取配置
        uses: actions/checkout@v64
      
      - name: 智能解析 KMI 版本与构建时间
        id: parse
        run: |
          A_VER="${{ inputs.android_version }}"
          K_VER="${{ inputs.kernel_version }}"
          PATCH="${{ inputs.os_patch_level }}"
          SUB="${{ inputs.sub_level }}"
          REV="${{ inputs.revision }}"
          B_TIME="${{ inputs.build_time }}"

          # 1. 处理版本号逻辑
          if [ "$PATCH" = "latest" ]; then
            echo "🔍 正在读取 config/kmi_latest.env..."
            source config/kmi_latest.env
            PREFIX=$(echo "${A_VER}_${K_VER}" | tr 'a-z' 'A-Z' | tr '-' '_' | tr '.' '_')
            TAG_VAR="${PREFIX}_LATEST"
            SUB_VAR="${PREFIX}_SUBLEVEL"
            
            LATEST_TAG=${!TAG_VAR}
            SUB=${!SUB_VAR}
            
            if [ -n "$LATEST_TAG" ]; then
              SUFFIX=${LATEST_TAG#${A_VER}-${K_VER}-}
              PATCH=$(echo $SUFFIX | cut -d'_' -f1)
              REV=$(echo $SUFFIX | grep -o 'r.*' || echo "")
            else
              echo "❌ 配置文件中没有找到最新版本！"
              exit 1
            fi
          fi

          # 2. 处理构建时间逻辑
          if [ "$B_TIME" = "N" ] || [ -z "$B_TIME" ]; then
            # 自动生成当前 UTC 时间
            B_TIME=$(date -u "+%a %b %d %H:%M:%S UTC %Y")
            echo "⏰ 构建时间设为现在: $B_TIME"
          else
            echo "📌 使用自定义构建时间: $B_TIME"
          fi

          # 3. 输出变量
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "rev=$REV" >> $GITHUB_OUTPUT
          echo "sub=$SUB" >> $GITHUB_OUTPUT
          echo "time=$B_TIME" >> $GITHUB_OUTPUT

  # ==================== 实际构建任务 ====================
  build-custom-kernel:
    needs: resolve-config
    name: "构建: ${{ inputs.kernel_version }}.${{ needs.resolve-config.outputs.sub }}-${{ inputs.android_version }}-${{ needs.resolve-config.outputs.patch }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ needs.resolve-config.outputs.sub }}
      os_patch_level: ${{ needs.resolve-config.outputs.patch }}
      revision: ${{ needs.resolve-config.outputs.rev }}
      
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ needs.resolve-config.outputs.time }}
      
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}

  get-ksu-manager:
    needs: resolve-config
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
