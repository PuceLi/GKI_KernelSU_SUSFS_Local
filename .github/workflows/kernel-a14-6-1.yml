name: 内核构建 - Android 14 (6.1)

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - MKSU
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      kernelsu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (N为当前UTC)"
        required: false
        type: string
        default: "N"
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_kpm:
        description: "启用 KPM 功能"
        required: true
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "N"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: boolean
      cancel_susfs:
        required: false
        type: boolean
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false

jobs:
  # ==================== 智能矩阵生成器 ====================
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      time: ${{ steps.set-time.outputs.time }}
    steps:
      - name: 检出代码读取配置
        uses: actions/checkout@v6
        
      - name: 解析构建时间
        id: set-time
        run: |
          B_TIME="${{ inputs.build_time }}"
          if [ "$B_TIME" = "N" ] || [ -z "$B_TIME" ]; then
            echo "time=$(date -u "+%a %b %d %H:%M:%S UTC %Y")" >> $GITHUB_OUTPUT
          else
            echo "time=$B_TIME" >> $GITHUB_OUTPUT
          fi
          
      - name: 从 JSON 自动提取最新 4 个 6.1 版本 + LTS
        id: set-matrix
        run: |
          # 💯 指向最新的专属配置文件
          JSON_FILE="config/android14/6.1.json"
          
          # 检查 JSON 文件是否存在
          if [ ! -f "$JSON_FILE" ]; then
            echo "❌ 错误: 未找到 $JSON_FILE，请先运行配置抓取工作流！"
            exit 1
          fi
          
          # ⚡ 极速提取：抓取前缀后面的所有字符 (修复修订号被吃掉的问题)
          MATRIX_JSON=$(jq -c '
            .latest | map({
                sub_level: .sublevel, 
                os_patch_level: (.tags[0] | capture("android[0-9]+-[0-9]+\\.[0-9]+-(?<patch>.+)$")).patch
              })
          ' "$JSON_FILE")
          
          # 验证提取是否成功
          if [ "$MATRIX_JSON" = "null" ] || [ -z "$MATRIX_JSON" ] || [ "$MATRIX_JSON" = "[]" ]; then
             echo "❌ 错误: 从 JSON 提取版本信息失败！"
             exit 1
          fi
          
          # 手动将 LTS 选项拼接到自动生成的矩阵数组后面
          FINAL_MATRIX=$(echo "$MATRIX_JSON" | jq -c '. + [{"sub_level": "X", "os_patch_level": "lts"}]')
          
          echo "生成的最终构建矩阵："
          echo "$FINAL_MATRIX" | jq .
          
          # 输出给下一步
          echo "matrix={\"include\":$FINAL_MATRIX}" >> $GITHUB_OUTPUT

  # ==================== 并发编译任务 ====================
  build-kernels-a14-6-1:
    needs: generate-matrix
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      # 接收智能生成的矩阵
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      # 这些变量现在是动态从 JSON 里读取出来的最新值
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ needs.generate-matrix.outputs.time }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
