name: Build a13-5-10

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        # description: "选择 KernelSU | 注意:选中MKSU时为标准版"
        description: "Choose KernelSU"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
        default: SukiSU
      kernelsu_branch:
        description: "Nhánh ksu"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)
      # kernelsu_branch_other:
      #   description: "如果选择了 “其他”，请指定您的自定义分支"
      #   required: false
      #   type: string  # This input is required if 'Other' is chosen
      version:
        description: 'Nhập suffix tùy chỉnh, sẽ hiển thị sau phiên bản kernel'
        required: false
        type: string
      build_time:
        description: ' '
        required: false
        type: string
      use_zram:
        description: ' Bật ZRAM? '
        required: true
        type: boolean
        default: true
      use_bbg:
        description: ' Dùng BBG?'
        required: true
        type: boolean
        default: true
      use_kpm:
        description: ' Dùng KPM?'
        required: true
        type: boolean
        default: true
      get_manager:
        description: ' Lấy trình quản lý và module susfs mới nhất?'
        required: true
        type: boolean
        default: true
      onlyAk3:
        description: 'Chỉ upload anykernel3?'
        required: false
        type: boolean
        default: false

jobs:

  build-kernel-a13-5-10:
    uses: ./.github/workflows/kernel-a13-5.10.yml
    secrets: inherit
    with:
      make_release: false
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      onlyAk3: ${{ inputs.onlyAk3 }}
      build_time: ${{ inputs.build_time }}
  get-ksu-manager:
    if: ${{ inputs.get_manager }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}

